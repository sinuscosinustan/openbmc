# Unfortunately, the KCS interface and serial output do not work
# without the ASPEED Super-IO.
CONFIG_ASPEED_ALLOW_DANGEROUS_BACKDOORS=y
CONFIG_ASPEED_ENABLE_SUPERIO=y

# We use a 32M layout on a 64M SPI, so force set the bootcmd from
# the flash_32M.cfg file.
CONFIG_BOOTCOMMAND="bootm 20080000"
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x60000
